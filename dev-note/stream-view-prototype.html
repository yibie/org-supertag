<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — SuperTag Stream View</title>
    <link rel="icon" href="data:," />
    <!--
      THROWAWAY UI PROTOTYPE — not production code.
      Question: How should an independent Stream View feel inside Emacs?
      Three ASCII-first variants, switchable with ?variant=A|B|C.
      Run: open dev-note/stream-view-prototype.html
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      .prototype-switcher {
        bottom: calc(env(safe-area-inset-bottom) + 3rem);
      }

      .note-target {
        scroll-margin-top: 3rem;
      }

      button {
        font: inherit;
      }
    </style>
  </head>
  <body class="m-0 min-h-dvh bg-slate-950 text-slate-200">
    <main id="app"></main>

    <div
      class="prototype-switcher fixed left-1/2 z-50 flex -translate-x-1/2 items-center border border-sky-400 bg-slate-950 px-2 py-1 font-mono text-xs text-slate-100"
      aria-label="Prototype variant switcher"
    >
      <button
        id="previous-variant"
        type="button"
        class="px-2 py-1 text-sky-300 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400"
        aria-label="Previous prototype variant"
      >[&lt;]</button>
      <span id="variant-label" class="min-w-36 px-2 text-center tabular-nums"></span>
      <button
        id="next-variant"
        type="button"
        class="px-2 py-1 text-sky-300 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400"
        aria-label="Next prototype variant"
      >[&gt;]</button>
    </div>

    <script>
      const notes = [
        {
          id: "01J8-ARCHIVES",
          title: "Package archives and priority",
          source: "~/notes/emacs.org:182",
          tags: ["emacs/package", "emacs/package/elpa", "configuration"],
          body: [
            "MELPA 和 GNU ELPA 同时启用时，优先级应该写成显式数据，而不是",
            "依赖 archive 的排列顺序。换机器或重建配置后，行为仍然可解释。",
            "",
            "#+begin_src emacs-lisp",
            "(setq package-archive-priorities",
            "      '((\"gnu\"    . 30)",
            "        (\"nongnu\" . 20)",
            "        (\"melpa\"  . 10)))",
            "#+end_src",
            "",
            "关键不是把 MELPA 放在最后，而是让选择规则能被未来的自己读懂。",
          ],
        },
        {
          id: "01J8-PINNING",
          title: "ELPA package pinning notes",
          source: "~/notes/package-management.org:47",
          tags: ["emacs/package/elpa", "emacs/debugging"],
          body: [
            "当某个包在多个 archive 中同名时，可以用 pinning 固定来源。",
            "排查时先看 package-alist 和 archive metadata，不要直接删整个缓存。",
            "",
            "| Package | Archive | Reason         |",
            "|---------+---------+----------------|",
            "| org     | gnu     | 跟随稳定版     |",
            "| magit   | melpa   | 需要新版本修复 |",
            "",
            "> 先确认解析结果，再清理状态；缓存不是第一嫌疑人。",
          ],
        },
        {
          id: "01J8-REBUILD",
          title: "Rebuilding packages after an Emacs upgrade",
          source: "~/notes/emacs-upgrade.org:91",
          tags: ["emacs/package", "emacs/upgrade", "checklist"],
          body: [
            "大版本升级后只重编译真正依赖旧 ABI 的包。保留 package declarations，",
            "让安装状态可以重建。",
            "",
            "- 记录当前 Emacs 与 native-comp 版本。",
            "- 删除旧版本生成的 native compilation cache。",
            "- 重新启动，再处理实际失败的包。",
            "- 最后运行一次配置 smoke test。",
            "",
            "不要把一次升级变成“重写整个配置”的借口。",
          ],
        },
        {
          id: "01J8-DESIGN",
          title: "Package declarations are documentation",
          source: "~/notes/configuration-design.org:28",
          tags: ["emacs/package", "configuration", "design"],
          body: [
            "一段 package declaration 至少应该回答三件事：为什么安装、何时加载、",
            "用户入口是什么。其余配置尽量靠近第一次使用它的地方。",
            "",
            "> 配置的读者不是今天正在输入代码的人，而是半年后试图删除它的人。",
            "",
            "如果删除声明后复杂度没有重新出现在其他地方，这段配置本来就不需要存在。",
          ],
        },
      ];

      const variants = {
        A: { name: "plain-buffer", render: renderVariantA },
        B: { name: "org-outline", render: renderVariantB },
        C: { name: "split-window", render: renderVariantC },
      };

      const params = new URLSearchParams(location.search);
      const state = {
        variant: normalizeVariant(params.get("variant")),
        tag: params.get("tag") || "emacs/package",
        activeNoteId: notes[0].id,
        folded: new Set(),
        message: "Read only.  4 notes matched exactly or by namespace prefix.",
      };

      function normalizeVariant(value) {
        return Object.hasOwn(variants, value) ? value : "A";
      }

      function visibleNotes() {
        const prefix = `${state.tag}/`;
        return notes.filter((note) => note.tags.some(
          (tag) => tag === state.tag || tag.startsWith(prefix),
        ));
      }

      function escapeHtml(value) {
        return value.replace(/[&<>'"]/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        })[character]);
      }

      function asciiRule(character = "-", width = 94) {
        return `<div class="overflow-hidden whitespace-nowrap text-slate-600">${character.repeat(width)}</div>`;
      }

      function tagButtons(tags) {
        return tags.map((tag) => `
          <button
            type="button"
            data-tag="${escapeHtml(tag)}"
            class="text-sky-300 hover:bg-slate-800 hover:text-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400"
            aria-label="Follow tag ${escapeHtml(tag)}"
          >[${escapeHtml(tag)}]</button>
        `).join(" ");
      }

      function noteBody(note, indent = "") {
        const body = note.body.map((line) => `${indent}${line}`).join("\n");
        return `<div class="whitespace-pre-wrap text-pretty leading-6 text-slate-200">${escapeHtml(body)}</div>`;
      }

      function emacsFrame(content, modeName) {
        const bufferName = `*supertag-stream: ${state.tag}*`;
        return `
          <section class="flex h-dvh min-h-dvh flex-col overflow-hidden bg-slate-950 font-mono text-sm">
            <header class="shrink-0">
              <div class="bg-slate-200 px-2 py-1 text-slate-950">
                File  Edit  Options  Buffers  Tools  Supertag  Help
              </div>
              <div class="border-b border-slate-600 bg-slate-900 px-2 py-1 text-slate-400">
                GNU Emacs 30.1&nbsp;&nbsp; [ ${escapeHtml(bufferName)} ]&nbsp;&nbsp; +scratch+
              </div>
            </header>
            <div class="flex-1 overflow-auto px-3 pb-28 pt-3 sm:px-5">
              ${content}
            </div>
            <footer class="shrink-0">
              <div class="overflow-hidden whitespace-nowrap bg-slate-300 px-2 text-slate-950">
                -UU-:**--F1&nbsp; ${escapeHtml(bufferName)}&nbsp;&nbsp; All L1&nbsp;&nbsp; (${modeName}) ----------------
              </div>
              <div id="stream-status" class="overflow-hidden whitespace-nowrap bg-slate-950 px-2 py-1 text-slate-300" role="status" aria-live="polite">
                ${escapeHtml(state.message)}
              </div>
            </footer>
          </section>
        `;
      }

      function streamHeading(label) {
        return `
          <div class="mb-5">
            <div class="text-sky-300">Supertag Stream :: ${escapeHtml(label)}</div>
            <div>query: tag == "${escapeHtml(state.tag)}" OR tag ^= "${escapeHtml(state.tag)}/"</div>
            <div>view:  read-only / full body / creation order</div>
            ${asciiRule("=")}
          </div>
        `;
      }

      function renderVariantA(stream) {
        const content = `
          <div>
            ${streamHeading(state.tag)}
            ${stream.map((note) => `
              <article id="note-${note.id}" class="note-target mb-5" data-note-id="${note.id}">
                <div class="${state.activeNoteId === note.id ? "text-sky-300" : "text-slate-500"}">
                  ${state.activeNoteId === note.id ? "=> " : "   "}${tagButtons(note.tags)}
                </div>
                <button
                  type="button"
                  data-open-note="${note.id}"
                  class="text-left text-slate-100 hover:bg-slate-800 hover:text-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400"
                >* ${escapeHtml(note.title)}</button>
                <div class="mb-2 text-slate-500">  ${escapeHtml(note.source)}  ::  ${note.id}</div>
                ${noteBody(note, "  ")}
                ${asciiRule("-")}
              </article>
            `).join("")}
            <div class="text-slate-500">-- end of stream --</div>
          </div>
        `;
        return emacsFrame(content, "Supertag-Stream");
      }

      function renderVariantB(stream) {
        const content = `
          <div>
            ${streamHeading("Org outline")}
            <div class="mb-3 text-slate-500">Click a heading to fold it.  z toggles the note at point.</div>
            ${stream.map((note, index) => {
              const folded = state.folded.has(note.id);
              return `
                <article id="note-${note.id}" class="note-target mb-4" data-note-id="${note.id}">
                  <button
                    type="button"
                    data-toggle-note="${note.id}"
                    aria-expanded="${!folded}"
                    class="block text-left ${state.activeNoteId === note.id ? "text-sky-300" : "text-slate-100"} hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400"
                  >${state.activeNoteId === note.id ? "=>" : "  "} ${folded ? "[+]" : "[-]"} * ${String(index + 1).padStart(2, "0")} ${escapeHtml(note.title)}</button>
                  ${folded ? "" : `
                    <div class="text-slate-500">     :PROPERTIES:</div>
                    <div class="text-slate-500">     :ID:       ${note.id}</div>
                    <div class="text-slate-500">     :SOURCE:   ${escapeHtml(note.source)}</div>
                    <div class="text-slate-500">     :END:</div>
                    <div class="mb-2">     :TAGS:     ${tagButtons(note.tags)}</div>
                    ${noteBody(note, "     ")}
                  `}
                </article>
              `;
            }).join("")}
            <div class="text-slate-500">-- end of outline --</div>
          </div>
        `;
        return emacsFrame(content, "Supertag-Stream Org");
      }

      function renderVariantC(stream) {
        const content = `
          <div class="grid h-[calc(100dvh-8rem)] min-h-96 w-full overflow-hidden border border-slate-600 lg:grid-cols-[30ch_minmax(0,1fr)]">
            <aside class="flex min-h-0 flex-col border-b border-slate-600 lg:border-b-0 lg:border-r">
              <div class="bg-slate-900 px-2 py-1 text-slate-300">*supertag-tags*</div>
              <div class="min-h-0 flex-1 overflow-auto p-3 leading-6">
                <div>[-] emacs</div>
                <button type="button" data-tag="emacs/package" class="block text-left text-sky-300 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400">  [-] package</button>
                <button type="button" data-tag="emacs/package/elpa" class="block text-left text-slate-300 hover:bg-slate-800 hover:text-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">      |- elpa</button>
                <button type="button" data-tag="emacs/upgrade" class="block text-left text-slate-300 hover:bg-slate-800 hover:text-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">      \`- upgrade</button>
                <div class="mt-3">[-] configuration</div>
                <div>  \`- design</div>
              </div>
              <div class="shrink-0 overflow-hidden whitespace-nowrap bg-slate-300 px-1 text-slate-950">-UU-  *supertag-tags*  (Supertag-Tags)</div>
            </aside>
            <section class="flex min-h-0 flex-col overflow-hidden">
              <div class="shrink-0 bg-slate-900 px-2 py-1 text-slate-300">*supertag-stream: ${escapeHtml(state.tag)}*</div>
              <div class="min-h-0 flex-1 overflow-auto p-3">
                ${streamHeading("split window")}
                ${stream.map((note) => `
                  <article id="note-${note.id}" class="note-target mb-5" data-note-id="${note.id}">
                    <div class="${state.activeNoteId === note.id ? "text-sky-300" : "text-slate-500"}">${state.activeNoteId === note.id ? "=>" : "  "} ${tagButtons(note.tags)}</div>
                    <button type="button" data-open-note="${note.id}" class="text-left text-slate-100 hover:bg-slate-800 hover:text-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">* ${escapeHtml(note.title)}</button>
                    <div class="mb-2 text-slate-500">  ${escapeHtml(note.source)}</div>
                    ${noteBody(note, "  ")}
                    ${asciiRule("-")}
                  </article>
                `).join("")}
              </div>
              <div class="shrink-0 overflow-hidden whitespace-nowrap bg-slate-300 px-1 text-slate-950">-UU-  *supertag-stream*  (Supertag-Stream)</div>
            </section>
          </div>
        `;
        return emacsFrame(content, "Supertag-Workspace");
      }

      function render() {
        const stream = visibleNotes();
        if (stream.length && !stream.some((note) => note.id === state.activeNoteId)) {
          state.activeNoteId = stream[0].id;
        }
        document.querySelector("#app").innerHTML = variants[state.variant].render(stream);
        document.querySelector("#variant-label").textContent =
          `${state.variant} / ${variants[state.variant].name}`;
        bindPrototypeActions();
      }

      function bindPrototypeActions() {
        document.querySelectorAll("[data-tag]").forEach((button) => {
          button.addEventListener("click", () => {
            state.tag = button.dataset.tag;
            state.message = `Following tag: ${state.tag}`;
            updateUrl();
            render();
          });
        });

        document.querySelectorAll("[data-open-note]").forEach((button) => {
          button.addEventListener("click", () => openNote(button.dataset.openNote));
        });

        document.querySelectorAll("[data-toggle-note]").forEach((button) => {
          button.addEventListener("click", () => toggleNote(button.dataset.toggleNote));
        });
      }

      function setVariant(nextVariant) {
        state.variant = normalizeVariant(nextVariant);
        updateUrl();
        render();
        document.querySelector("#app > section > div")?.scrollTo({ top: 0 });
      }

      function cycleVariant(direction) {
        const keys = Object.keys(variants);
        const index = keys.indexOf(state.variant);
        setVariant(keys[(index + direction + keys.length) % keys.length]);
      }

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        url.searchParams.set("tag", state.tag);
        history.replaceState(null, "", url);
      }

      function selectNote(noteId) {
        state.activeNoteId = noteId;
        const note = notes.find((candidate) => candidate.id === noteId);
        state.message = `Point moved to: ${note.title}`;
        render();
        document.querySelector(`#note-${CSS.escape(noteId)}`)?.scrollIntoView({ block: "start" });
      }

      function moveNote(direction) {
        const stream = visibleNotes();
        const index = stream.findIndex((note) => note.id === state.activeNoteId);
        const nextIndex = Math.min(Math.max(index + direction, 0), stream.length - 1);
        selectNote(stream[nextIndex].id);
      }

      function openNote(noteId = state.activeNoteId) {
        const note = notes.find((candidate) => candidate.id === noteId);
        state.activeNoteId = noteId;
        state.message = `o => find-file ${note.source}`;
        render();
      }

      function toggleNote(noteId = state.activeNoteId) {
        if (state.variant !== "B") return;
        state.activeNoteId = noteId;
        state.folded.has(noteId) ? state.folded.delete(noteId) : state.folded.add(noteId);
        state.message = `z => ${state.folded.has(noteId) ? "folded" : "opened"} ${noteId}`;
        render();
      }

      function followNextTag() {
        const note = notes.find((candidate) => candidate.id === state.activeNoteId);
        const nextTag = note.tags.find((tag) => tag !== state.tag) || note.tags[0];
        state.tag = nextTag;
        state.message = `t => following tag: ${state.tag}`;
        updateUrl();
        render();
      }

      function keyboardTargetIsEditable(target) {
        return ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName) || target.isContentEditable;
      }

      document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
      document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));

      document.addEventListener("keydown", (event) => {
        if (keyboardTargetIsEditable(event.target)) return;
        if (event.key === "ArrowLeft") cycleVariant(-1);
        if (event.key === "ArrowRight") cycleVariant(1);
        if (event.key === "n") moveNote(1);
        if (event.key === "p") moveNote(-1);
        if (event.key === "o") openNote();
        if (event.key === "t") followNextTag();
        if (event.key === "z") toggleNote();
        if (event.key === "g") {
          state.tag = "emacs/package";
          state.activeNoteId = notes[0].id;
          state.message = "g => stream refreshed from exact + descendants query.";
          updateUrl();
          render();
        }
        if (event.key === "q") {
          state.message = "q => quit-window";
          render();
        }
      });

      render();
    </script>
  </body>
</html>
